[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-eval"
version = "0.1.0a0"
description = "Research scaffolding for evaluating autonomous memory writing and retrieval in LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema[format-nongpl]>=4.10.3,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
