[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-eval"
version = "0.1.0a0"
description = "Research scaffolding for evaluating autonomous memory writing and retrieval in LLM agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jsonschema[format-nongpl]>=4.18,<5",
    "referencing>=0.30,<1",
]

[project.optional-dependencies]
tau2 = [
    "tau2 @ git+https://github.com/sierra-research/tau2-bench.git@c06b07dd7c4d4ec61ba6ff9bcdf0b15dd7ef36d4 ; python_version >= '3.12' and python_version < '3.14'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
